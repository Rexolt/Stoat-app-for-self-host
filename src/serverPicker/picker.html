<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a server</title>
    <style>
      :root {
        --bg: #191919;
        --surface: #242424;
        --surface-hover: #2e2e2e;
        --border: #353535;
        --accent: #fd6671;
        --accent-hover: #ff7a84;
        --text: #f5f5f5;
        --text-dim: #9a9a9a;
        --error: #ff5c5c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .subtitle {
        font-size: 14px;
        color: var(--text-dim);
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      .official-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--surface-hover);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .official-btn:hover {
        border-color: var(--accent);
        background: #313131;
      }

      .official-btn .host {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-dim);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: var(--text-dim);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      input[type="text"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px 14px;
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s ease;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
      }

      input[type="text"]::placeholder {
        color: #5e5e5e;
      }

      .connect-btn {
        width: 100%;
        margin-top: 12px;
        background: var(--accent);
        border: none;
        border-radius: 10px;
        padding: 13px 16px;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .connect-btn:hover {
        background: var(--accent-hover);
      }

      .connect-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .error {
        color: var(--error);
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
      }

      .recent {
        margin-top: 24px;
      }

      .recent-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 9px 10px;
        color: var(--text-dim);
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .recent-item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .hint {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 8px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Choose your server</h1>
      <p class="subtitle">
        Connect to the official Stoat instance or sign in to your own
        self-hosted server.
      </p>

      <span class="label">Official</span>
      <button class="official-btn" id="official">
        <span>Stoat</span>
        <span class="host" id="official-host"></span>
      </button>

      <div class="divider">or self-hosted</div>

      <span class="label">Server address</span>
      <input
        type="text"
        id="url"
        placeholder="https://chat.example.com"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="hint">
        Enter the URL where your Stoat/Revolt web app is hosted.
      </p>
      <div class="error" id="error"></div>
      <button class="connect-btn" id="connect">Connect</button>

      <div class="recent" id="recent-wrap" style="display: none">
        <span class="label">Recent</span>
        <div id="recent-list"></div>
      </div>
    </div>

    <script>
      (function () {
        const api = window.serverManager;
        const officialBtn = document.getElementById("official");
        const officialHost = document.getElementById("official-host");
        const urlInput = document.getElementById("url");
        const connectBtn = document.getElementById("connect");
        const errorEl = document.getElementById("error");
        const recentWrap = document.getElementById("recent-wrap");
        const recentList = document.getElementById("recent-list");

        if (!api) {
          errorEl.textContent =
            "Server manager unavailable. Please restart the app.";
          return;
        }

        const defaultUrl = api.getDefault();
        try {
          officialHost.textContent = new URL(defaultUrl).host;
        } catch (e) {
          officialHost.textContent = defaultUrl;
        }

        function normalise(value) {
          let v = (value || "").trim();
          if (!v) return null;
          if (!/^https?:\/\//i.test(v)) {
            v = "https://" + v;
          }
          try {
            const u = new URL(v);
            return u.toString().replace(/\/$/, "");
          } catch (e) {
            return null;
          }
        }

        function select(url) {
          connectBtn.disabled = true;
          api.select(url);
        }

        officialBtn.addEventListener("click", () => select(defaultUrl));

        connectBtn.addEventListener("click", () => {
          errorEl.textContent = "";
          const url = normalise(urlInput.value);
          if (!url) {
            errorEl.textContent = "Please enter a valid server address.";
            return;
          }
          select(url);
        });

        urlInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") connectBtn.click();
        });

        const current = api.getCurrent();
        if (current) {
          urlInput.value = current;
        }

        const recent = (api.getRecent() || []).filter(
          (r) => r && r !== defaultUrl,
        );
        if (recent.length) {
          recentWrap.style.display = "block";
          recent.forEach((url) => {
            const btn = document.createElement("button");
            btn.className = "recent-item";
            let host = url;
            try {
              host = new URL(url).host;
            } catch (e) {}
            btn.innerHTML =
              "<span>" + host + "</span><span>&rsaquo;</span>";
            btn.addEventListener("click", () => select(url));
            recentList.appendChild(btn);
          });
        }

        urlInput.focus();
      })();
    </script>
  </body>
</html>
